name: Android APK

# Compila un APK de depuración (firmado con una clave de depuración efímera) y lo sube como artefacto.
# Descárgalo desde la pestaña Actions -> la ejecución -> Artifacts, e instálalo en el móvil.
on:
  push:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  tests:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Importar recursos
        run: godot --headless --import || true
      - name: Tests de lógica
        run: godot --headless --path . --script tests/run_tests.gd -- --quick
      - name: Humo de la UI
        run: godot --headless --path . res://tests/smoke.tscn

  apk:
    needs: tests
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Plantillas de exportación
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/ 2>/dev/null || true
      - name: Clave de depuración
        run: |
          [ -f /root/debug.keystore ] || keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore /root/debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
      - name: Ajustes del editor (rutas de Java y Android SDK)
        run: |
          JAVA_DIR="${JAVA_HOME:-$(dirname "$(dirname "$(readlink -f "$(which javac)")")")}"
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/lib/android-sdk}}"
          echo "JAVA_DIR=$JAVA_DIR  SDK_DIR=$SDK_DIR"
          ls "$SDK_DIR" || true
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-4.3.tres; do
            cat > ~/.config/godot/$f <<EOS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_DIR"
          export/android/android_sdk_path = "$SDK_DIR"
          EOS
          done
          cat ~/.config/godot/editor_settings-4.tres
      - name: Importar y exportar APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --import || true
          godot --headless --verbose --export-debug "Android" build/cavila.apk
          ls -la build
      - uses: actions/upload-artifact@v4
        with:
          name: cavila-debug-apk
          path: build/cavila.apk

  # Publica el APK en una release fija llamada "latest": el enlace de descarga directa es
  # siempre el mismo y apunta a la última versión compilada.
  publish:
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cavila-debug-apk
          path: build
      - name: Actualizar la release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/cavila.apk \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Cavila (última versión de prueba)" \
            --notes "APK de depuración compilado automáticamente desde la rama ${{ github.ref_name }} (commit ${{ github.sha }})."
